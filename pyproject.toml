[project]
name = "nl2sql-agent"
version = "0.1.0"
description = "Natural language to Oracle SQL agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "openai",
    "oracledb",
    "psycopg[binary]",
    "mysql-connector-python",
    "pydantic",
    "pydantic-settings",
    "sqlglot",
    "uvicorn",
    "langgraph==1.1.6",
    "langgraph-checkpoint==4.0.1",
    "langgraph-checkpoint-sqlite==3.0.3",
    "langchain==1.2.15",
    "langchain-core==1.3.0",
    "langchain-openai==1.1.14",
    "langchain-anthropic==1.4.0",
    "mcp==1.27.0",
    "langchain-mcp-adapters==0.2.2",
    "nicegui==3.10.0",
    "aiosqlite==0.22.1",
    "deepagents==0.5.3",
    "loguru==0.7.3",
    "anyio",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
