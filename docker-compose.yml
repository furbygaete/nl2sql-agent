# Local container testing for nl2sql-agent.
#   docker compose up --build
#
# Brings up the FastAPI app on http://localhost:8000 with:
#   - secrets from .env (OPENAI_API_KEY, ANTHROPIC_API_KEY, SQLCL_CONNECTIONS, ...)
#   - LangGraph SQLite checkpoints persisted on the host at ./memory/
#   - Linux SQLcl + Oracle Instant Client (thick mode) baked into the image
#     via scripts/install-{sqlcl,instantclient}.sh during the Docker build
#   - healthcheck against /health, restart on failure
#
# NOTE: do NOT bind-mount your host ./vendor/sqlcl or ./third_party — on a
# Windows host those folders contain Windows binaries that this Linux
# container can't execute. Both are installed inside the image instead.

services:
  nl2sql-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: nl2sql-agent:local
    container_name: nl2sql-agent
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      API_WORKERS: "1"
      # Override host paths from .env: inside the container, SQLcl and the
      # Oracle Instant Client live at fixed locations baked in by the build.
      SQLCL_PATH: "/workspace/vendor/sqlcl/bin/sql"
      ORACLE_CLIENT_MODE: "thick"
      ORACLE_CLIENT_LIB_DIR: "/workspace/third_party/instantclient_23_6"
      ORACLE_CLIENT_CONFIG_DIR: ""

    volumes:
      # LangGraph AsyncSqliteSaver / AsyncSqliteStore checkpoints
      - ./memory:/workspace/memory

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
